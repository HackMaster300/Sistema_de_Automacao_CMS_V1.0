[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-automation"
version = "2.4.0"
description = "Automação RPA modular para inserção de dados num sistema CMS legado"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "keyboard>=0.13.5",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.0.0"]
calibration = ["ruamel.yaml>=0.18.0"]
packaging = ["pyinstaller>=6.0.0"]

[project.scripts]
cms-automation = "cms_automation.cli:main"

[project.gui-scripts]
cms-automation-gui = "cms_automation.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
